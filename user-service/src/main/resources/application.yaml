server:
  port: 8095
  servlet:
    context-path: /api

feign:
  sentinel:
    enabled: true

logging:
  level:
    com.zc.user: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

hm:
  swagger:
    title: 用户服务接口文档
    package: com.zc.user.controller
  db:
    database: hmall
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi

